name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            goos: linux
            goarch: arm64
          - platform: macos-amd64
            goos: darwin
            goarch: amd64
          - platform: macos-arm64
            goos: darwin
            goarch: arm64
          - platform: windows-amd64
            goos: windows
            goarch: amd64
          - platform: windows-arm64
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          out="dist/phash-${PLATFORM}"
          if [ "$GOOS" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -v -o "$out" ./cmd/phash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: phash-${{ matrix.platform }}
          path: dist/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: phash-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/*
          generate_release_notes: true
